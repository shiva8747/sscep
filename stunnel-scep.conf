# stunnel configuration for SCEP proxy
# Usage: stunnel stunnel-scep.conf

# Global options
foreground = yes
debug = 5

# SCEP proxy service
[scep-proxy]
client = yes
accept = 127.0.0.1:8080
connect = emsign-server1.qa.emudhra.net:444

# TLS options
verify = 0
# If you want to verify the server certificate, uncomment and set:
# verify = 2
# CAfile = /path/to/ca-bundle.crt
